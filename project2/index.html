<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Аудіо Діалог</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1">
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="emoji-selector" id="emojiSelector">
            <div class="emoji-grid"></div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="messages-wrapper" id="messagesWrapper">
                <!-- Діалоги будуть додаватися динамічно -->
            </div>
        </div>
        <div class="audio-controls">
            <div id="waveform"></div>
            <div class="player-controls">
                <button id="playPause">▶️</button>
                <span id="currentTime">0:00</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
